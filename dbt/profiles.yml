governai:
  target: "{{ env_var('DBT_TARGET', 'prod') }}"
  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_DBT_ROLE', 'GOVAI_DBT_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'GOVERNAI') }}"
      warehouse: "{{ env_var('SNOWFLAKE_DBT_WAREHOUSE', 'GOVAI_TRANSFORM_WH') }}"
      schema: STAGING
      threads: 4
      client_session_keep_alive: false
      query_tag: governai_phase2_dbt
